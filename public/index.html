<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mfumo wa Kupanga Walinzi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white; color: black; }
            .no-print { display: none !important; }
            .print-area { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        <!-- Header -->
        <header class="bg-indigo-900 text-white p-6 rounded-xl shadow-md mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">MFUMO WA RATIBA YA WALINZI</h1>
                <p class="text-indigo-200 text-sm">Ikulu, PBZ, Ulinzi Kituo & CRO (Shift Tatu)</p>
            </div>
            <div class="flex gap-3 no-print">
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow flex items-center gap-2">
                    🖨️ Print / Hifadhi PDF
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- SEHEMU YA 1: USAJILI WA ASKARI -->
            <div class="bg-white p-5 rounded-xl shadow-md no-print">
                <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 mb-4">1. Sajili Askari</h2>
                <form id="soldierForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Jina Kamili:</label>
                        <input type="text" id="name" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Mf. Koplo Juma">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Namba ya Kijeshi (Service No):</label>
                        <input type="number" id="serviceNumber" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Mf. 14250">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium transition">
                        Ongeza Askari
                    </button>
                </form>

                <div class="mt-6">
                    <h3 class="text-md font-semibold text-slate-700 mb-2">Orodha ya Askari Waliopo (<span id="soldierCount">0</span>)</h3>
                    <div id="soldiersList" class="max-h-60 overflow-y-auto space-y-2 border p-2 rounded-lg bg-slate-50">
                        <!-- Orodha ya askari itaingia hapa -->
                    </div>
                </div>
            </div>

            <!-- SEHEMU YA 2: RATIBA NA TEMPLATE -->
            <div class="lg:col-span-2 space-y-6">
                
                <div class="bg-white p-5 rounded-xl shadow-md no-print flex flex-wrap gap-4 items-center justify-between">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Chagua Mtindo wa Ratiba (Template):</label>
                        <select id="templateSelector" onchange="changeTemplate()" class="p-2 border rounded-lg bg-white font-medium text-slate-700 outline-none">
                            <option value="modern">Template 1: Ya Kisasa (Modern Card)</option>
                            <option value="classic">Template 2: Ya Kiserikali (Table Grid)</option>
                        </select>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="rotateAndGenerate()" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium shadow transition" title="Badilisha mgawanyo ili kuhakikisha haki">
                            🔄 Badilisha Mgawanyo
                        </button>
                        <button onclick="generateSchedule()" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-lg font-bold shadow transition">
                            Gawanya na Panga Ratiba Otomatiki
                        </button>
                    </div>
                </div>

                <!-- SEHEMU YA KUONESHA RATIBA -->
                <div id="scheduleContainer" class="bg-white p-6 rounded-xl shadow-md print-area border">
                    <div class="text-center mb-6">
                        <h2 class="text-xl font-bold uppercase text-indigo-900">RATIBA YA ULINZI - VIKOSI</h2>
                        <p class="text-sm text-slate-500">Tarehe: <span id="currentDate"></span></p>
                    </div>

                    <div id="scheduleContent" class="space-y-6">
                        <p class="text-center text-slate-400 py-8">Bonyeza "Gawanya na Panga Ratiba Otomatiki" ili kuona mgawanyo.</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        const STORAGE_KEY = 'guardSystem.soldiers';
        const ROTATION_KEY = 'guardSystem.rotation';

        // Escape user input before injecting it into innerHTML
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function loadSoldiers() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(parsed)) return [];
                return parsed
                    .filter(s => s && typeof s.name === 'string' && Number.isFinite(s.serviceNumber))
                    .map(s => ({ name: s.name, serviceNumber: Number(s.serviceNumber) }));
            } catch (err) {
                console.warn('Could not read saved roster, starting empty.', err);
                return [];
            }
        }

        function saveSoldiers() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(soldiers));
            } catch (err) {
                console.warn('Could not save roster; it will be lost on refresh.', err);
            }
        }

        let soldiers = loadSoldiers();
        const posts = ["IKULU", "PBZ", "ULINZI KITUO", "CRO"];
        const shifts = ["Shift 1 (Saa 02:00 - 10:00)", "Shift 2 (Saa 10:00 - 18:00)", "Shift 3 (Saa 18:00 - 02:00)"];

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

        document.getElementById('soldierForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const serviceNumber = parseInt(document.getElementById('serviceNumber').value, 10);

            if (!name || !Number.isInteger(serviceNumber)) {
                alert("Tafadhali jaza jina na namba ya kijeshi kwa njia sahihi.");
                return;
            }

            if (soldiers.some(s => s.serviceNumber === serviceNumber)) {
                alert(`Namba ya kijeshi ${serviceNumber} tayari imesajiliwa. Tumia namba nyingine.`);
                return;
            }

            soldiers.push({ name, serviceNumber });
            // Panga askari kuanzia namba ndogo kwenda kubwa au kinyume chake
            soldiers.sort((a, b) => a.serviceNumber - b.serviceNumber);

            document.getElementById('name').value = '';
            document.getElementById('serviceNumber').value = '';
            saveSoldiers();
            updateSoldiersUI();
        });

        function updateSoldiersUI() {
            const listContainer = document.getElementById('soldiersList');
            document.getElementById('soldierCount').innerText = soldiers.length;
            listContainer.innerHTML = '';

            soldiers.forEach((s, index) => {
                listContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 rounded border text-sm">
                        <span><b>${escapeHtml(s.name)}</b> (No: ${escapeHtml(s.serviceNumber)})</span>
                        <button onclick="removeSoldier(${index})" class="text-red-500 hover:text-red-700 font-bold px-2" title="Ondoa askari">&times;</button>
                    </div>
                `;
            });
        }

        function removeSoldier(index) {
            soldiers.splice(index, 1);
            saveSoldiers();
            updateSoldiersUI();
        }

        function generateSchedule() {
            // Malindo 4 * Shift 3 = Shift 12 zinahitajika. Kila shift ina Senior 1 na Junior 1 (Jumla askari 24 wanahitajika)
            if (soldiers.length < 24) {
                alert("Tafadhali sajili angalau askari 24 ili kukamilisha malindo yote 4 na shift zake tatu.");
                return;
            }

            // Rotating the roster keeps duties fair: the same guards are not always
            // stuck on the first post/shift every time a new roster is generated.
            const rotation = parseInt(localStorage.getItem(ROTATION_KEY) || '0', 10) || 0;
            let availableSoldiers = [...soldiers];
            if (availableSoldiers.length) {
                const offset = rotation % availableSoldiers.length;
                availableSoldiers = availableSoldiers.slice(offset).concat(availableSoldiers.slice(0, offset));
            }

            let htmlContent = '';
            const template = document.getElementById('templateSelector').value;

            posts.forEach(post => {
                let postHtml = '';
                let shiftData = [];

                shifts.forEach(shift => {
                    let senior = availableSoldiers.shift();
                    let junior = availableSoldiers.shift();

                    if (!senior) senior = { name: "Nafasi Wazi", serviceNumber: "-" };
                    if (!junior) junior = { name: "Nafasi Wazi", serviceNumber: "-" };

                    shiftData.push({ shift, senior, junior });
                });

                if (template === 'modern') {
                    postHtml = `
                        <div class="border border-indigo-100 rounded-lg p-4 bg-indigo-50/30 mb-4">
                            <h3 class="font-bold text-indigo-900 text-base mb-3 border-b border-indigo-200 pb-1">📍 LINDO: ${post}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    `;
                    shiftData.forEach(d => {
                        postHtml += `
                            <div class="bg-white p-3 rounded border shadow-sm">
                                <div class="text-xs font-bold text-indigo-600 mb-1">${d.shift}</div>
                                <div class="text-sm">⭐ <b>Senior:</b> ${escapeHtml(d.senior.name)} (${escapeHtml(d.senior.serviceNumber)})</div>
                                <div class="text-sm">🛡️ <b>Junior:</b> ${escapeHtml(d.junior.name)} (${escapeHtml(d.junior.serviceNumber)})</div>
                            </div>
                        `;
                    });
                    postHtml += `</div></div>`;
                } else {
                    postHtml = `
                        <div class="mb-4">
                            <h3 class="font-bold text-slate-800 bg-slate-200 p-2 text-sm">📍 ${post}</h3>
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-100 border-b">
                                        <th class="p-2 border">Shift</th>
                                        <th class="p-2 border">Senior Guard</th>
                                        <th class="p-2 border">Junior Guard</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    shiftData.forEach(d => {
                        postHtml += `
                            <tr class="border-b">
                                <td class="p-2 border font-medium text-slate-600">${d.shift}</td>
                                <td class="p-2 border">⭐ ${escapeHtml(d.senior.name)} (${escapeHtml(d.senior.serviceNumber)})</td>
                                <td class="p-2 border">🛡️ ${escapeHtml(d.junior.name)} (${escapeHtml(d.junior.serviceNumber)})</td>
                            </tr>
                        `;
                    });
                    postHtml += `</tbody></table></div>`;
                }

                htmlContent += postHtml;
            });

            document.getElementById('scheduleContent').innerHTML = htmlContent;
        }

        // Onyesha orodha iliyohifadhiwa mara tu ukurasa unapofunguliwa
        updateSoldiersUI();

        function rotateAndGenerate() {
            const step = posts.length * shifts.length || 1;
            const current = parseInt(localStorage.getItem(ROTATION_KEY) || '0', 10) || 0;
            try {
                localStorage.setItem(ROTATION_KEY, String(current + step));
            } catch (err) {
                console.warn('Could not save rotation.', err);
            }
            generateSchedule();
        }

        function changeTemplate() {
            if(document.getElementById('scheduleContent').innerHTML.trim() !== '') {
                generateSchedule();
            }
        }
    </script>
</body>
</html>
